<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global All Universities Finder — Dunyodagi Barcha Universitetlar</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; }

    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 2rem; color: var(--primary); margin-bottom: 0.5rem; }
    header p { color: #64748b; }

    .search-section { background: #fff; padding: 1.5rem; border-radius: var(--radius); border: 1px solid var(--border); display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .search-section input, .search-section select { flex: 1; min-width: 200px; padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; outline: none; }
    .search-section input:focus, .search-section select:focus { border-color: var(--primary); }

    .stats { font-weight: 600; color: #475569; margin-bottom: 1rem; }

    .uni-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
    .uni-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
    .uni-card:hover { transform: translateY(-2px); border-color: var(--primary); }
    .uni-name { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; color: #1e293b; }
    .uni-country { font-size: 0.85rem; color: #64748b; margin-bottom: 1rem; font-weight: 600; }
    
    .btn-link { display: inline-block; width: 100%; text-align: center; background: var(--primary); color: #fff; text-decoration: none; padding: 0.6rem; border-radius: 6px; font-weight: 600; font-size: 0.9rem; }
    .btn-link:hover { background: #1d4ed8; }

    .loading { text-align: center; font-size: 1.2rem; padding: 3rem; color: var(--primary); font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🌍 Global University Directory</h1>
      <p>Dunyodagi barcha davlat va xususiy universitetlarning to'liq bazasi</p>
    </header>

    <div class="search-section">
      <input type="text" id="country-input" placeholder="Davlat nomini kiriting (masalan: Uzbekistan, Japan, Germany, USA...)" value="Uzbekistan" onkeypress="handleKeyPress(event)">
      <button onclick="fetchUniversities()" style="padding: 0.75rem 1.5rem; background: var(--primary); color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:600;">Qidirish 🔍</button>
      <input type="text" id="filter-name" placeholder="Universitet nomi bo'yicha filter..." oninput="filterResults()">
    </div>

    <div id="stats" class="stats"></div>
    <div id="uni-container" class="uni-grid"></div>
  </div>

  <script>
    let allUniversities = [];

    async function fetchUniversities() {
      const country = document.getElementById('country-input').value.trim();
      const container = document.getElementById('uni-container');
      const stats = document.getElementById('stats');

      if (!country) {
        alert("Iltimos, davlat nomini kiriting!");
        return;
      }

      container.innerHTML = `<div class="loading" style="grid-column: 1/-1;">"${country}" bo'yicha barcha universitetlar bazasidan yuklanmoqda... ⏳</div>`;
      stats.innerText = "";

      try {
        // Global Ochiq API orqali BARCHA universitetlar tortiladi
        const response = await fetch(`https://universities.hipolabs.com/search?country=${encodeURIComponent(country)}`);
        allUniversities = await response.json();

        if (allUniversities.length === 0) {
          container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: #64748b;">Afsuski, "${country}" davlati bo'yicha ma'lumot topilmadi yoki ingilizcha nomini xato kiritdingiz (Masalan: Uzbekistan, USA, Japan, Germany).</div>`;
          return;
        }

        renderCards(allUniversities);

      } catch (error) {
        container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: red;">Ma'lumotlarni yuklashda xatolik yuz berdi. Internet aloqasini tekshiring.</div>`;
      }
    }

    function renderCards(data) {
      const container = document.getElementById('uni-container');
      const stats = document.getElementById('stats');

      stats.innerText = `Jami topilgan universitetlar soni: ${data.length} ta`;

      container.innerHTML = data.map(u => {
        const website = u.web_pages && u.web_pages.length > 0 ? u.web_pages[0] : '#';
        return `
          <div class="uni-card">
            <div>
              <div class="uni-name">${u.name}</div>
              <div class="uni-country">🏛️ ${u.country} ${u['state-province'] ? '• ' + u['state-province'] : ''}</div>
            </div>
            <a href="${website}" target="_blank" class="btn-link">Rasmiy saytiga o'tish ↗</a>
          </div>
        `;
      }).join('');
    }

    function filterResults() {
      const query = document.getElementById('filter-name').value.toLowerCase();
      const filtered = allUniversities.filter(u => u.name.toLowerCase().includes(query));
      renderCards(filtered);
    }

    function handleKeyPress(e) {
      if(e.key === 'Enter') fetchUniversities();
    }

    // Dastlab O'zbekiston universitetlarini yuklash
    window.onload = fetchUniversities;
  </script>

</body>
</html>
